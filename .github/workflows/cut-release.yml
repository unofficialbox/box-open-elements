name: Cut release

# Creates the vX.Y.Z tag and the GitHub Release for the version currently in
# package.json on main — the two steps a remote Claude Code session cannot do
# itself, because its push credential is scoped to branch refs and cannot
# write tags. Everything else stays as it was: publishing the GitHub Release
# fires release.yml, which runs the verify gate and the npm OIDC trusted
# publish with provenance.
#
# Flow for a release:
#   1. Merge the "Prepare vX.Y.Z release" PR (version bump + changelog).
#   2. Dispatch this workflow on main. It tags vX.Y.Z at HEAD and publishes a
#      GitHub Release whose notes are that version's CHANGELOG section.
#
# Idempotence and safety:
#   - Refuses to run off main.
#   - Refuses to move an existing tag; a re-run after a partial failure only
#     fills in whatever is missing (tag or release).
#   - The release body is extracted from CHANGELOG.md; an absent section
#     fails the run rather than publishing an empty release.

on:
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch release.yml: a Release created with GITHUB_TOKEN does
  # not fire `release: published` (GitHub suppresses workflow runs for events
  # caused by GITHUB_TOKEN), but workflow_dispatch is exempt from that rule.
  actions: write

jobs:
  cut:
    name: Tag + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are cut from main; got ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Resolve version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if ! grep -q "[^[:space:]]" /tmp/notes.md; then
            echo "No CHANGELOG.md section found for $VERSION — refusing to publish an empty release." >&2
            exit 1
          fi

      - name: Check adapter bootstrap before any release mutation
        id: adapter-preflight
        run: node tools/adapters/release-preflight.mjs

      - name: Create the core tag (skip if it already exists at HEAD)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
            if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $REMOTE_SHA (HEAD is $GITHUB_SHA) — refusing to move it." >&2
              exit 1
            fi
            echo "Tag $TAG already at HEAD; skipping."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish the core GitHub Release (skip if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --verify-tag
          fi

      # The adapters ship the core's version, so the same cut releases all seven
      # packages: one number, one dispatch, no second thing to remember. The
      # `adapters-v` tag is what release-adapters.yml validates its ref against.
      - name: Create the adapter tag (skip if it already exists at HEAD)
        env:
          TAG: adapters-v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
            if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $REMOTE_SHA (HEAD is $GITHUB_SHA) — refusing to move it." >&2
              exit 1
            fi
            echo "Tag $TAG already at HEAD; skipping."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish the adapter GitHub Release (skip if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: adapters-v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "Framework adapters for core $VERSION. See the v$VERSION release notes." \
              --verify-tag
          fi

      # Bootstrap/registry readiness was checked before any tags or releases.
      # A complete registry version is an idempotent rerun; otherwise dispatch
      # the full lockstep train. Missing packages never become a successful skip.
      - name: Trigger adapter npm publish via release-adapters.yml dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: adapters-v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          ALL_PUBLISHED: ${{ steps.adapter-preflight.outputs.all-published }}
        run: |
          if [ "$ALL_PUBLISHED" = "true" ]; then
            echo "npm already has all six adapters at $VERSION; not dispatching a publish."
            exit 0
          fi
          gh workflow run release-adapters.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched release-adapters.yml on $TAG."

      # A Release created with GITHUB_TOKEN does not fire `release: published`
      # (suppressed by GitHub to prevent recursion), so the npm publish must be
      # dispatched explicitly — workflow_dispatch is exempt from suppression,
      # and release.yml already supports it. Dispatching on the tag ref builds
      # exactly the tagged tree. Skipped when the version is already on npm,
      # so a re-run after a partial failure never double-publishes.
      - name: Trigger npm publish via release.yml dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PUBLISHED="$(curl -sf "https://registry.npmjs.org/@unofficialbox%2Fbox-open-elements" | node -p "Object.hasOwn(JSON.parse(require('fs').readFileSync(0,'utf8')).versions ?? {}, process.env.VERSION)" || echo unknown)"
          if [ "$PUBLISHED" = "true" ]; then
            echo "npm already has $VERSION; not dispatching a publish."
          else
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
            echo "Dispatched release.yml on $TAG."
          fi
