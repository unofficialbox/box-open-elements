name: Publish to npm

# Publishes @unofficialbox/box-open-elements to npm when a GitHub Release is
# published (or on a manual dispatch). Builds a fresh dist, runs the full verify
# gate, and publishes via npm OIDC "trusted publishing" — no long-lived token,
# with provenance generated automatically.
#
# One-time setup (no repo secret needed):
#   - On npmjs.com, configure a Trusted Publisher for the package: org
#     `unofficialbox`, this repository, workflow `release.yml`. This is what
#     authorises the tokenless OIDC publish below.
#   - Cut releases by bumping `version` in package.json, tagging `vX.Y.Z`, and
#     publishing a GitHub Release for that tag (the tag must match the version).
#
# A manual dispatch must select the `vX.Y.Z` tag as its ref. Dispatching from a
# branch fails the guard below rather than publishing an untagged tree.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # FIRST, before anything runs code from the checkout. This job holds
      # `id-token: write`, so the OIDC request variables are in the runner
      # environment from the start; `bun install` executes the *root* package's
      # own lifecycle scripts (Bun's trust model gates dependency scripts, not
      # the project's), so a hostile ref could mint and exfiltrate a publish
      # credential before a guard placed after the install ever ran. Reading
      # package.json with `node -p require()` only parses JSON — it runs no
      # scripts — and the runner's preinstalled Node serves for that.
      #
      # The guard applies to every trigger, not just Release events: the Actions
      # UI defaults a manual dispatch to main, and a main that has merged the
      # next version bump would otherwise publish an untagged tree under that
      # version. cut-release.yml already dispatches on the tag ref, so the
      # automated path is unaffected.
      - name: Check the ref is a version tag matching package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Refusing to publish from $GITHUB_REF — run this on the v$PKG tag." >&2
            exit 1
          fi
          # Compared whole, not with the `v` stripped: `${GITHUB_REF_NAME#v}`
          # leaves an unprefixed `X.Y.Z` tag untouched, so it would pass a guard
          # that only compares the remainder.
          if [ "$GITHUB_REF_NAME" != "v$PKG" ]; then
            echo "Ref $GITHUB_REF_NAME is not the expected tag v$PKG for this tree." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # npm (from Node) does the publish; Bun handles install + the build/test gate.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs a recent npm; the version bundled with
      # Node 22 predates it. This upgrade is what lets `npm publish` mint a
      # short-lived credential from the id-token — no NPM_TOKEN secret required.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (typecheck + coverage tests + build)
        run: bun run verify

      # Tokenless: authenticated via OIDC against the npm "trusted publisher"
      # configured for this package (org unofficialbox → this repo + workflow).
      # Provenance is generated automatically under trusted publishing.
      - name: Publish (OIDC trusted publishing)
        run: npm publish --access public
