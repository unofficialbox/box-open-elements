name: Publish to npm

# Publishes @unofficialbox/box-open-elements to npm when a GitHub Release is
# published (or on a manual dispatch). Builds a fresh dist, runs the full verify
# gate, and publishes via npm OIDC "trusted publishing" — no long-lived token,
# with provenance generated automatically.
#
# One-time setup (no repo secret needed):
#   - On npmjs.com, configure a Trusted Publisher for the package: org
#     `unofficialbox`, this repository, workflow `release.yml`. This is what
#     authorises the tokenless OIDC publish below.
#   - Cut releases by bumping `version` in package.json, tagging `vX.Y.Z`, and
#     publishing a GitHub Release for that tag (the tag must match the version).
#
# A manual dispatch must select the `vX.Y.Z` tag as its ref. Dispatching from a
# branch fails the guard below rather than publishing an untagged tree.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # npm (from Node) does the publish; Bun handles install + the build/test gate.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs a recent npm; the version bundled with
      # Node 22 predates it. This upgrade is what lets `npm publish` mint a
      # short-lived credential from the id-token — no NPM_TOKEN secret required.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Guard against publishing an untagged or mismatched tree. This applies to
      # manual dispatches too, not just Release events: the Actions UI defaults
      # the ref to main, and a main that has already merged the next version
      # bump would otherwise publish an untagged tree under that version. The
      # automated path (cut-release.yml) already dispatches on the tag ref, so
      # the guard costs it nothing.
      - name: Check the ref is a version tag matching package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Refusing to publish from $GITHUB_REF — run this on the v$PKG tag." >&2
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json version ($PKG) does not match the tag ($TAG)" >&2
            exit 1
          fi

      - name: Verify (typecheck + coverage tests + build)
        run: bun run verify

      # Tokenless: authenticated via OIDC against the npm "trusted publisher"
      # configured for this package (org unofficialbox → this repo + workflow).
      # Provenance is generated automatically under trusted publishing.
      - name: Publish (OIDC trusted publishing)
        run: npm publish --access public
