name: Regenerate visual baselines

# Opt-in baseline adoption for intentional visual changes: push a commit whose
# message contains `[regen-baselines]` to a non-main branch, and this workflow
# re-captures every baseline inside the SAME pinned Playwright container the
# pixel gate uses, then commits the result back to the branch. This makes
# baseline refresh possible from environments that cannot run the container
# locally (no docker daemon). The follow-up bot push does not itself trigger
# CI (GITHUB_TOKEN pushes never do) — push any commit afterwards to re-run the
# gate against the adopted baselines.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

concurrency: regen-baselines-${{ github.ref }}

jobs:
  regen:
    name: Re-capture in pinned container + commit
    if: contains(github.event.head_commit.message, '[regen-baselines]')
    runs-on: ubuntu-latest
    steps:
      # The job-level check matches anywhere in the message, but squash-merge
      # commits retain squashed subjects in their body — only a token in the
      # SUBJECT line is an intentional trigger.
      - name: Require the token in the commit subject
        id: gate
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1)"
          case "$subject" in
            *"[regen-baselines]"*)
              echo "Token found in subject — proceeding."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Token only appears in the commit body (likely a squash merge) — skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      # Same command as the local `baselines:regen` script — the captures are
      # container-rendered, so they are byte-compatible with the pixel gate.
      - name: Regenerate baselines (pinned container)
        if: steps.gate.outputs.run == 'true'
        run: bash tools/preview/container-run.sh "bun run build && bun tools/preview/capture.ts && bun tools/preview/docs-site-shots.ts"

      - name: Commit refreshed baselines
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore: adopt container-rendered visual baselines"
          git push
