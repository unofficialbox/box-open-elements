name: Publish framework adapters to npm

# Publishes the React, Angular, Vue, and Svelte adapters as one lockstep
# release. They ship the core package's version, so the tag is
# `adapters-v<core version>` — the same number as the core's `vX.Y.Z`.
#
# A manual dispatch must select that tag as its ref. Dispatching from a branch
# fails the guard below rather than publishing an untagged tree.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish framework adapters
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'adapters-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # FIRST, before anything runs code from the checkout. This job holds
      # `id-token: write`, so the OIDC request variables are in the runner
      # environment from the start, and `bun install` executes the root
      # package's own lifecycle scripts — a guard placed after the install
      # would leave a window for a hostile ref to mint a publish credential.
      # Reading package.json with `node -p require()` only parses JSON.
      - name: Check the ref is the adapter tag for this tree
        id: version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Refusing to publish from $GITHUB_REF — run this on the adapters-v$PKG tag." >&2
            exit 1
          fi
          # Compared whole rather than with the prefix stripped: stripping would
          # leave an unprefixed `X.Y.Z` tag untouched and let it through.
          if [ "$GITHUB_REF_NAME" != "adapters-v$PKG" ]; then
            echo "Ref $GITHUB_REF_NAME is not the expected tag adapters-v$PKG for this tree." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `verify` runs `adapters:version`, which fails unless all four manifests
      # carry the core version and peer on exactly `^<core version>`.
      - name: Verify repository
        run: bun run verify

      # One loop rather than four steps, and each package checks npm for its own
      # version first. Four unconditional publishes fail-fast: if a previous run
      # got two packages out before dying, the re-run hits the first
      # already-published one, errors, and never reaches the two that are still
      # missing — so the documented "re-run after a partial failure" could not
      # actually recover. Skipping only what is already at this exact version
      # makes the re-run finish the job, and still refuses to overwrite.
      - name: Publish the adapters (skipping any already at this version)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          published=0
          skipped=0
          for name in react angular vue svelte; do
            package="@unofficialbox/box-open-elements-$name"
            encoded="@unofficialbox%2Fbox-open-elements-$name"
            body="$(curl -sf "https://registry.npmjs.org/$encoded" || true)"
            if [ -n "$body" ] && printf '%s' "$body" \
              | node -pe "Object.hasOwn(JSON.parse(require('fs').readFileSync(0,'utf8')).versions ?? {}, process.env.VERSION)" \
              | grep -q true; then
              echo "$package is already at $VERSION; skipping."
              skipped=$((skipped + 1))
              continue
            fi
            echo "Publishing $package@$VERSION"
            npm publish "./packages/$name" --access public
            published=$((published + 1))
          done
          echo "Published $published, skipped $skipped (already at $VERSION)."
