name: Publish React adapter to npm

# Publishes @unofficialbox/box-open-elements-react independently from the core
# package. GitHub Releases for this package use react-vX.Y.Z tags.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish React adapter
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'react-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches adapter version
        if: github.event_name == 'release'
        run: |
          PKG="$(node -p "require('./packages/react/package.json').version")"
          TAG="${GITHUB_REF_NAME#react-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "packages/react/package.json version ($PKG) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Verify repository
        run: bun run verify

      - name: Publish React adapter (OIDC trusted publishing)
        run: npm publish ./packages/react --access public
